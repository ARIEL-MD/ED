name: Construire l'APK Esteti-Ma
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Adresse de l'API (ex. https://esteti-ma-api.onrender.com)"
        required: true
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run build
        env:
          VITE_API_URL: ${{ inputs.api_url }}
      - run: npx cap sync android
      - run: chmod +x android/gradlew && ./gradlew assembleDebug
        working-directory: frontend/android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ../Esteti-Ma.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Esteti-Ma APK ${{ github.run_number }}
          files: Esteti-Ma.apk
